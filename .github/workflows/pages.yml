name: Publish homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate site
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v6
      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html styles.css georgia-tech-seal.png robots.txt sitemap.xml .nojekyll _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
